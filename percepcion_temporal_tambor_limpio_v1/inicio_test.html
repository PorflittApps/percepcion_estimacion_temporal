<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ítem 1 Tambor</title><style>
:root{
  --navy:#0f2357;
  --blue:#2f4ea2;
  --text:#111827;
  --muted:#4b5563;
  --line:#d7dee9;
  --check:#155f7a;
  --soft:#f8fafc;
  --ok:#0f766e;
  --warn:#b45309;
  --bad:#9f1239;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,select,input{font-family:inherit}
.app{min-height:100vh;background:#fff}
.splash,.consent{
  min-height:100vh;width:100%;position:absolute;inset:0;background:#fff;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 2s ease;
}
.splash.active,.consent.active{opacity:1;pointer-events:auto}
.splash-logo{display:block;object-fit:contain;max-width:70vw;max-height:185px}
.logo-uc-only{max-height:220px;max-width:80vw}
.logo-cedeti-only{max-height:160px}
.logo-facultad-only{max-height:170px}
.consent{padding:3rem 1.5rem}
.consent-inner{width:min(980px,92vw);text-align:center}
.consent-inner h1,.test-title{
  margin:0;color:var(--navy);font-family:Georgia,'Times New Roman',serif;
  font-weight:600;font-size:clamp(2.35rem,4.5vw,4.35rem);line-height:1.08
}
.subtitle{margin:1.1rem auto 0;max-width:880px;color:#273a69;font-size:clamp(1.1rem,1.8vw,1.55rem);line-height:1.45}
.consent-card{margin:2.35rem auto 0;width:min(880px,100%);border:1px solid var(--line);border-radius:16px;padding:2rem 2.1rem 1.7rem}
.consent-card h2{margin:0 0 1rem;color:var(--navy);font-size:clamp(1.4rem,2.1vw,1.95rem)}
.consent-card p{margin:.55rem auto;max-width:760px;color:#26364a;font-size:clamp(1rem,1.35vw,1.15rem);line-height:1.55}
.btn{
  min-width:220px;padding:1rem 1.45rem;border-radius:12px;text-decoration:none;font-size:1.05rem;font-weight:700;
  border:1px solid var(--navy);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--navy)
}
.btn.primary{background:var(--navy);color:#fff}
.btn.secondary{background:#fff;color:var(--navy)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions,.big-action{margin-top:1.8rem;display:flex;justify-content:center;gap:1.1rem;flex-wrap:wrap}
.demographics{min-height:100vh;background:#fff;padding:2.2rem 1.4rem 3rem;display:flex;justify-content:center}
.demo-wrap{width:min(1180px,96vw)}
.demo-wrap h1{font-size:2rem;font-weight:500;margin:0 0 2.2rem;color:#111}
.demo-form{display:flex;flex-direction:column;gap:1.25rem}
.demo-row{display:grid;grid-template-columns:minmax(260px,420px) minmax(270px,530px);align-items:center;gap:1.6rem;min-height:52px}
.demo-label,.demo-row legend{font-size:1.18rem;color:#111;line-height:1.35}
.demo-row select{border:0;background:#fff;color:#64748b;font-size:1.1rem;padding:.65rem .4rem;width:100%;max-width:530px}
fieldset.demo-row{border:0;padding:0;margin:0}
.choice-line{display:flex;gap:3.4rem;align-items:center;flex-wrap:wrap}
.choice-line.compact{gap:2.5rem}
.choice-line label{display:inline-flex;align-items:center;gap:.8rem;font-size:1.12rem;color:#111;cursor:pointer}
.choice-line input{appearance:none;width:32px;height:32px;background:var(--check);border:2px solid #0e2f42;border-radius:3px;position:relative;cursor:pointer}
.choice-line input:checked::after{content:"✓";position:absolute;inset:-4px 0 0 0;color:#fff;text-align:center;line-height:32px;font-size:1.45rem;font-weight:900}
.hidden-row{display:none!important}.hidden-row.show{display:grid!important}
.long-row{grid-template-columns:minmax(520px,840px) auto}.long-select{grid-template-columns:minmax(520px,840px) minmax(270px,530px)}
.note{font-weight:400}.form-actions{margin-top:1.8rem;display:flex;justify-content:center}
.status{min-height:1.3rem;text-align:center;color:var(--blue);font-weight:700;margin-top:.8rem}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;padding:2rem}
.card{width:min(760px,92vw);border:1px solid var(--line);border-radius:20px;text-align:center;padding:2.5rem 2rem}
.card h1{font-family:Georgia,'Times New Roman',serif;color:var(--navy);font-size:3rem;margin:0 0 1rem}
.card p{color:#4b5563;font-size:1.1rem;line-height:1.6}
.test-page{min-height:100vh;background:#fff;padding:2rem 1.25rem;display:flex;justify-content:center}
.test-wrap{width:min(1080px,96vw)}
.test-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.3rem}
.progress-text{color:#4b5563;font-weight:700}
.progressbar{height:8px;background:#e9eef6;border-radius:999px;overflow:hidden;margin:0 0 1.5rem}
.progressbar span{display:block;height:100%;background:var(--blue);width:0%;transition:width .35s ease}
.test-card{border:1px solid var(--line);border-radius:20px;padding:2rem;background:#fff;box-shadow:0 10px 30px rgba(15,35,87,.06)}
.test-card h2{margin:0 0 .75rem;color:var(--navy);font-size:clamp(1.45rem,2.4vw,2rem)}
.instruction{font-size:1.18rem;line-height:1.55;color:#26364a;margin:.5rem 0 1.4rem}
.trial-meta{color:#64748b;font-weight:700;margin-bottom:1rem}
.muted{color:#64748b}
.drum-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;margin:1.4rem auto 1.1rem}
.drum-button{
  width:218px;height:218px;border-radius:999px;border:8px solid #6b3f25;
  background:radial-gradient(circle at 50% 42%,#f3d2aa 0 43%,#d9a46c 44% 63%,#9b5e35 64% 100%);
  box-shadow:inset 0 8px 18px rgba(255,255,255,.45),inset 0 -16px 24px rgba(63,36,18,.22),0 18px 34px rgba(88,52,29,.22);
  color:#3d2414;font-weight:900;font-size:1.15rem;text-align:center;cursor:pointer;transition:transform .08s ease,box-shadow .12s ease,opacity .12s ease;
  display:flex;align-items:center;justify-content:center;padding:1rem;
}
.drum-button:active,.drum-button.hit{transform:scale(.96);box-shadow:inset 0 10px 24px rgba(63,36,18,.26),0 9px 20px rgba(88,52,29,.18)}
.drum-button:disabled{opacity:.55;cursor:not-allowed}
.beat-dots{display:flex;justify-content:center;gap:.55rem;margin:1rem 0 .2rem}
.beat-dot{width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;background:#fff}
.beat-dot.done{background:#2f4ea2;border-color:#2f4ea2}
.feedback-box{margin:1.1rem auto 0;width:min(760px,100%);border:1px solid #d7dee9;background:#fbfcfe;border-radius:16px;padding:1rem 1.15rem;color:#26364a;line-height:1.5;text-align:center}
.feedback-box.ok{border-color:#99d5ca;background:#f0fdfa;color:#0f766e}
.feedback-box.warn{border-color:#f7c983;background:#fffbeb;color:#92400e}
.feedback-box.bad{border-color:#f1a7a7;background:#fff1f2;color:#9f1239}
.metrics-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:1.2rem 0}
.metrics-mini div{border:1px solid #e1e7f0;background:#fbfcfe;border-radius:14px;padding:.85rem;text-align:center}
.metrics-mini span{display:block;color:#64748b;font-size:.9rem}
.metrics-mini strong{display:block;color:#0f2357;font-size:1.15rem;margin-top:.25rem}
.final-note{margin-top:1rem;color:#4b5563;line-height:1.55}
@media(max-width:860px){
  .demo-row,.long-row,.long-select{grid-template-columns:1fr;gap:.4rem}
  .choice-line{gap:1.1rem}.test-top{flex-direction:column;align-items:flex-start}
  .metrics-mini{grid-template-columns:1fr}.drum-button{width:184px;height:184px}.splash-logo{max-width:84vw}
}
</style></head>
<body>
<main class="test-page">
  <section class="test-wrap">
    <div class="test-top"><h1 class="test-title">Percepción y Estimación Temporal</h1><div class="progress-text" id="progress-text">Tambor limpio V1</div></div>
    <div class="progressbar"><span id="progressbar"></span></div>
    <div class="test-card" id="test-card"></div>
  </section>
</main>
<script>
const ITEM1_PLAN = [{"mode": "pretest", "trial": 0, "title": "Pretest de práctica", "condition": "pulso medio, sonido breve", "bpm": 90, "soundType": "breve", "heardBeats": 8, "audio": "audios/item1_tambor/Item1_Pretest_tambor.wav"}, {"mode": "trial", "trial": 1, "title": "Trial 1", "condition": "pulso medio, sonido breve", "bpm": 90, "soundType": "breve", "heardBeats": 8, "audio": "audios/item1_tambor/Item1_Trial1_pulso_medio_sonido_breve.wav"}, {"mode": "trial", "trial": 2, "title": "Trial 2", "condition": "pulso rápido, sonido breve", "bpm": 112, "soundType": "breve", "heardBeats": 8, "audio": "audios/item1_tambor/Item1_Trial2_pulso_rapido_sonido_breve.wav"}, {"mode": "trial", "trial": 3, "title": "Trial 3", "condition": "pulso lento, sonido breve", "bpm": 68, "soundType": "breve", "heardBeats": 8, "audio": "audios/item1_tambor/Item1_Trial3_pulso_lento_sonido_breve.wav"}, {"mode": "trial", "trial": 4, "title": "Trial 4", "condition": "pulso medio, sonido largo", "bpm": 90, "soundType": "largo", "heardBeats": 8, "audio": "audios/item1_tambor/Item1_Trial4_pulso_medio_sonido_largo.wav"}, {"mode": "trial", "trial": 5, "title": "Trial 5", "condition": "pulso rápido, sonido largo", "bpm": 112, "soundType": "largo", "heardBeats": 8, "audio": "audios/item1_tambor/Item1_Trial5_pulso_rapido_sonido_largo.wav"}, {"mode": "trial", "trial": 6, "title": "Trial 6", "condition": "pulso lento, sonido largo", "bpm": 68, "soundType": "largo", "heardBeats": 8, "audio": "audios/item1_tambor/Item1_Trial6_pulso_lento_sonido_largo.wav"}];
const REQUIRED_TAPS = 4;
const PRETEST_ENTRY_TOLERANCE = 0.18;
const PRETEST_MEAN_ABS_TOLERANCE = 0.20;
const PRETEST_VARIABILITY_TOLERANCE = 0.18;
const EXPERIMENT_TENDENCY_TOLERANCE = 0.12;

let current = null;
let currentAudio = null;
let cueStartPerf = 0;
let expectedTimes = [];
let taps = [];
let results = [];
let pretestAttempts = 0;

const card = document.getElementById("test-card");
const bar = document.getElementById("progressbar");
const progressText = document.getElementById("progress-text");

document.addEventListener("DOMContentLoaded", renderIntro);

function renderIntro(){
  bar.style.width = "0%";
  progressText.textContent = "Ítem 1 · Tambor";
  card.innerHTML = `
    <div class="trial-meta">VERSIÓN TAMBOR LIMPIO V1</div>
    <h2>Ítem 1: continuación de pulso con tambor</h2>
    <p class="instruction">Escuchará una serie de golpes de tambor. Cuando los golpes se detengan, continúe el pulso presionando el tambor cuatro veces más.</p>
    <p class="instruction">Primero realizará una práctica. Cuando la práctica esté correcta, comenzarán los seis trials del ítem.</p>
    <div class="big-action"><button class="btn primary" onclick="renderPhase(ITEM1_PLAN[0])">Comenzar práctica</button></div>`;
}

function renderPhase(spec){
  stopAudio();
  current = spec;
  taps = [];
  expectedTimes = [];
  const isPretest = spec.mode === "pretest";
  const title = isPretest ? "Pretest de práctica" : `Ítem 1 · ${spec.title}`;
  const subtitle = isPretest ? "Escuche el pulso y luego continúe con cuatro golpes." : "Escuche el pulso y continúe con cuatro golpes cuando la secuencia termine.";
  updateProgress();
  card.innerHTML = `
    <div class="trial-meta">${isPretest ? "Práctica" : "Ítem experimental"} · ${spec.condition}</div>
    <h2>${title}</h2>
    <p class="instruction">${subtitle}</p>
    <div class="drum-stage">
      <button id="drum" class="drum-button">Escuchar</button>
      <div class="beat-dots" id="beat-dots"><span class="beat-dot"></span><span class="beat-dot"></span><span class="beat-dot"></span><span class="beat-dot"></span></div>
    </div>
    <p class="muted" id="hint">Presione “Escuchar”. Cuando termine la secuencia, el tambor quedará habilitado para responder.</p>
    <div id="feedback"></div>`;
  document.getElementById("drum").addEventListener("click", handleDrumClick);
}

async function handleDrumClick(){
  const drum = document.getElementById("drum");
  if (!drum.dataset.response) {
    await playCue();
  } else if (drum.dataset.response === "1") {
    registerTap();
  }
}

async function playCue(){
  const drum = document.getElementById("drum");
  const hint = document.getElementById("hint");
  drum.disabled = true;
  drum.textContent = "Escuche";
  hint.textContent = "Escuche la secuencia completa. Luego continúe el pulso con cuatro golpes.";
  currentAudio = new Audio(current.audio);
  currentAudio.preload = "auto";
  cueStartPerf = performance.now();
  const interval = 60 / current.bpm;
  const firstExpectedAfterCue = current.heardBeats * interval;
  expectedTimes = [0,1,2,3].map(i => firstExpectedAfterCue + i * interval);
  currentAudio.onended = () => {
    drum.disabled = false;
    drum.dataset.response = "1";
    drum.textContent = "Continuar pulso";
    hint.textContent = "Ahora presione el tambor cuatro veces, manteniendo el mismo pulso.";
  };
  try {
    await currentAudio.play();
  } catch(e) {
    drum.disabled = false;
    drum.textContent = "Escuchar";
    hint.textContent = "No se pudo reproducir el audio. Revise el volumen o permisos del navegador e intente nuevamente.";
  }
}

function registerTap(){
  const drum = document.getElementById("drum");
  drum.classList.add("hit");
  setTimeout(()=>drum.classList.remove("hit"),110);
  const elapsed = (performance.now() - cueStartPerf) / 1000;
  const tapIndex = taps.length;
  const expected = expectedTimes[tapIndex];
  const error = expected - elapsed;
  taps.push({tap:tapIndex+1, expected, performed:elapsed, error, absError:Math.abs(error)});
  updateDots();
  if (taps.length >= REQUIRED_TAPS) {
    drum.disabled = true;
    drum.dataset.response = "0";
    evaluateCurrent();
  }
}

function updateDots(){
  document.querySelectorAll(".beat-dot").forEach((dot,i)=>{if(i<taps.length)dot.classList.add("done");});
}

function evaluateCurrent(){
  const evaluation = evaluateTaps(taps);
  const isPretest = current.mode === "pretest";
  if (isPretest) {
    pretestAttempts += 1;
    results.push({kind:"pretest", attempt:pretestAttempts, bpm:current.bpm, soundType:current.soundType, condition:current.condition, taps, evaluation});
    const feedback = document.getElementById("feedback");
    if (evaluation.pass) {
      feedback.innerHTML = `<div class="feedback-box ok"><strong>Muy bien.</strong><br>La práctica fue registrada correctamente. Ahora comenzaremos el ítem experimental.</div>`;
      setTimeout(()=>renderPhase(ITEM1_PLAN[1]),1300);
    } else {
      feedback.innerHTML = `<div class="feedback-box ${evaluation.kind === "irregular" ? "warn" : "bad"}">${feedbackMessage(evaluation)}</div><div class="big-action"><button class="btn primary" onclick="renderPhase(ITEM1_PLAN[0])">Intentar nuevamente</button></div>`;
    }
    return;
  }
  results.push({kind:"trial", item:1, trial:current.trial, bpm:current.bpm, soundType:current.soundType, condition:current.condition, taps, evaluation});
  document.getElementById("feedback").innerHTML = `<div class="feedback-box ok">Respuesta registrada.</div>`;
  setTimeout(()=>{
    if (current.trial >= 6) renderFinal();
    else renderPhase(ITEM1_PLAN[current.trial + 1]);
  }, 800);
}

function evaluateTaps(tapList){
  const errors = tapList.map(t=>t.error);
  const absErrors = tapList.map(t=>Math.abs(t.error));
  const firstError = errors[0] || 0;
  const meanError = mean(errors);
  const meanAbsError = mean(absErrors);
  const variability = sd(errors);
  let tendency = "ajustada";
  if (meanError > EXPERIMENT_TENDENCY_TOLERANCE) tendency = "adelantada";
  if (meanError < -EXPERIMENT_TENDENCY_TOLERANCE) tendency = "atrasada";
  let pass = true, kind = "ok";
  if (firstError > PRETEST_ENTRY_TOLERANCE) { pass = false; kind = "early"; }
  else if (firstError < -PRETEST_ENTRY_TOLERANCE) { pass = false; kind = "late"; }
  else if (meanAbsError > PRETEST_MEAN_ABS_TOLERANCE || variability > PRETEST_VARIABILITY_TOLERANCE) { pass = false; kind = "irregular"; }
  return {pass, kind, firstError, meanError, meanAbsError, variability, tendency};
}

function feedbackMessage(evaluation){
  if (evaluation.kind === "early") return "<strong>Entraste un poco antes del pulso.</strong><br>Intente esperar un poco más antes del primer golpe.";
  if (evaluation.kind === "late") return "<strong>Entraste un poco después del pulso.</strong><br>Intente entrar un poco antes, siguiendo el pulso que venía escuchando.";
  if (evaluation.kind === "irregular") return "<strong>Intenta mantener el pulso de manera más constante.</strong><br>Probemos otra vez.";
  return "<strong>Muy bien.</strong>";
}

function updateProgress(){
  if (!current || current.mode === "pretest") {
    bar.style.width = "0%";
    progressText.textContent = "Práctica";
    return;
  }
  bar.style.width = Math.round(((current.trial - 1) / 6) * 100) + "%";
  progressText.textContent = `Trial ${current.trial} de 6`;
}

function renderFinal(){
  stopAudio();
  bar.style.width = "100%";
  progressText.textContent = "Ítem 1 finalizado";
  const trialResults = results.filter(r=>r.kind==="trial");
  const allAbs = trialResults.flatMap(r=>r.taps.map(t=>Math.abs(t.error)));
  const avgAbs = mean(allAbs);
  const variability = mean(trialResults.map(r=>r.evaluation.variability));
  const tendency = globalTendency(mean(trialResults.map(r=>r.evaluation.meanError)));
  const row = buildResearchRow();
  localStorage.setItem("item1_tambor_resultados", JSON.stringify({demographics:getDemo(), results, row, savedAt:new Date().toISOString()}));
  card.innerHTML = `<h2>Ítem 1 finalizado</h2><p class="instruction">Sus respuestas fueron registradas correctamente en este navegador. Los siguientes ítems serán incorporados en una próxima versión del test.</p><div class="metrics-mini"><div><span>Tendencia general</span><strong>${tendency}</strong></div><div><span>Ajuste promedio</span><strong>${labelAccuracy(avgAbs)}</strong></div><div><span>Regularidad</span><strong>${labelRegularity(variability)}</strong></div></div><p class="final-note">Estos resultados son orientativos y no constituyen una evaluación diagnóstica.</p><p class="final-note">Ante cualquier duda o comentario, contactarse con Felipe Porflitt B., investigador responsable al correo: felipe@uc.cl.</p>`;
}

function buildResearchRow(){
  const d = getDemo();
  const row = {fecha:new Date().toISOString(), participant_id:d.participant_id||"", Edad:d.edad||"", Sexo:d.sexo||"", Pais:d.pais||"", Estudios:d.estudios||"", SegundoIdioma:d.segundo_idioma||"", Hablar:d.hablar||0, Escuchar:d.escuchar||0, Leer:d.leer||0, Escribir:d.escribir||0, Ent_sinMirar:d.ent_sin_mirar||"", hrsMus:d.hrs_mus||"", ConAnio:d.con_anio||"", AutoDef:d.autodef||""};
  results.filter(r=>r.kind==="pretest").forEach(r=>{const prefix=`Item1_Pretest_Attempt${r.attempt}`; row[`${prefix}_bpm`]=r.bpm; row[`${prefix}_tipo_sonido`]=r.soundType; row[`${prefix}_aprobado`]=r.evaluation.pass?1:0; row[`${prefix}_feedback`]=r.evaluation.kind; addTapColumns(row,prefix,r);});
  results.filter(r=>r.kind==="trial").forEach(r=>{const prefix=`Item1_Trial${r.trial}`; row[`${prefix}_bpm`]=r.bpm; row[`${prefix}_tipo_sonido`]=r.soundType; row[`${prefix}_condicion`]=r.condition; row[`${prefix}_tendencia`]=r.evaluation.tendency; row[`${prefix}_error_promedio`]=round(r.evaluation.meanError); row[`${prefix}_error_absoluto_promedio`]=round(r.evaluation.meanAbsError); row[`${prefix}_variabilidad`]=round(r.evaluation.variability); addTapColumns(row,prefix,r);});
  return row;
}
function addTapColumns(row,prefix,r){r.taps.forEach(t=>{row[`${prefix}_tap${t.tap}_esperado`]=round(t.expected);row[`${prefix}_tap${t.tap}_realizado`]=round(t.performed);row[`${prefix}_tap${t.tap}_error`]=round(t.error);});}
function getDemo(){try{return JSON.parse(localStorage.getItem("demograficos_percepcion_temporal")||"{}");}catch(e){return{};}}
function stopAudio(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null;}}
function mean(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;}
function sd(arr){if(arr.length<=1)return 0;const m=mean(arr);return Math.sqrt(mean(arr.map(x=>Math.pow(x-m,2))));}
function round(n){return Math.round(n*1000)/1000;}
function globalTendency(v){if(v>EXPERIMENT_TENDENCY_TOLERANCE)return"adelantada";if(v<-EXPERIMENT_TENDENCY_TOLERANCE)return"atrasada";return"ajustada";}
function labelAccuracy(v){if(v<=0.10)return"alto";if(v<=0.20)return"medio";return"bajo";}
function labelRegularity(v){if(v<=0.08)return"alta";if(v<=0.16)return"media";return"baja";}
</script>
</body></html>
